# Builds the portable Windows exe (no installer; WebView2 ships with Win10/11).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies (Tauri CLI)
        run: bun install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build portable exe
        run: bun run tauri build --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: katalogos-windows
          # The binary is named after mainBinaryName: «Τηλεφωνικός Κατάλογος.exe».
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
