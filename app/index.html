<!DOCTYPE html>
<html lang="el">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>251 ΓΝΑ · Τηλεφωνικός Κατάλογος</title>
	<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<button class="icon-btn theme-toggle start-theme" id="themeToggle" type="button" aria-pressed="false" aria-label="Εναλλαγή σκούρας εμφάνισης">
		<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
		<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
	</button>

	<main class="start">
		<section class="card start-card">
			<img class="start-logo" src="assets/logo-128.png" alt="251 ΓΝΑ" width="112" height="112">
			<h1>Τηλεφωνικός Κατάλογος</h1>
			<p class="subtitle">251 Γενικό Νοσοκομείο Αεροπορίας</p>

			<div class="start-actions" id="startActions">
				<a class="big-btn" href="catalog.html">Προβολή καταλόγου</a>
				<button class="big-btn secondary" id="adminBtn" type="button">Διαχείριση</button>
			</div>

			<form class="login-form" id="loginForm" hidden novalidate>
				<h2 id="loginTitle">Κωδικός διαχείρισης</h2>
				<input id="password" type="password" autocomplete="current-password" placeholder="Κωδικός" aria-label="Κωδικός">
				<input id="password2" type="password" autocomplete="new-password" placeholder="Επανάληψη κωδικού" aria-label="Επανάληψη κωδικού" hidden>
				<p class="login-error" id="loginError" role="alert" hidden></p>
				<button class="big-btn" id="loginSubmit" type="submit">Είσοδος</button>
				<button class="link-btn login-cancel" id="loginCancel" type="button">Πίσω</button>
			</form>
		</section>
	</main>

	<script type="module" src="js/start.js"></script>
</body>
</html>
