<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Records Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #41509b;
            --bg-gradient-end: #513275;
            --surface: #d8dadc;
            --surface-muted: #cacdd0;
            --surface-muted-th: #c6cad3;
            --surface-hover: #bdc5d2;
            --text-primary: #222942;
            --text-secondary: #444f70;
            --text-muted: #596480;
            --accent: #3e54ad;
            --accent-hover: #364ea6;
            --border-color: #bcc8dc;
            --row-border: #ccd7e7;
            --badge-bg: #cfe2ff;
            --badge-text: #0f4f98;
            --loading-text: #535d7a;
            --error-bg: #ffd4dc;
            --error-text: #8f1d2b;
            --highlight-bg: #ffd96a;
            --highlight-text: #534200;
            --shadow-color: rgba(15, 26, 52, 0.2);
            --row-hover-shadow: rgba(15, 26, 52, 0.18);
        }

        body.dark-mode {
            --bg-gradient-start: #151d31;
            --bg-gradient-end: #232038;
            --surface: #1f2638;
            --surface-muted: #2a3146;
            --surface-hover: #323a52;
            --text-primary: #edf1ff;
            --text-secondary: #c8d0ed;
            --text-muted: #a7b0cf;
            --accent: #8ea6ff;
            --accent-hover: #7b95f5;
            --border-color: #3a435f;
            --row-border: #313953;
            --badge-bg: #2a3c67;
            --badge-text: #bdd5ff;
            --loading-text: #c2cae5;
            --error-bg: #4b2230;
            --error-text: #ffd0db;
            --highlight-bg: #5a4a17;
            --highlight-text: #ffecac;
            --shadow-color: rgba(0, 0, 0, 0.35);
            --row-hover-shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            height: 100dvh;
            overflow: hidden;
            padding: 20px;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            display: flex;
            align-items: stretch;
        }

        .layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Left panel ── */
        .left-panel {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 8px var(--shadow-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .brand-text {
            min-width: 0;
        }

        h1 {
            color: var(--accent);
            font-size: 1.8em;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .theme-toggle {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            padding: 0;
            font-size: 18px;
            background: var(--surface-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .search-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 8px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            transition: border-color 0.3s;
            background: var(--surface);
            color: var(--text-primary);
            min-width: 0;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            padding: 12px 18px;
            font-size: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
        }

        .search-hint {
            font-size: 0.82em;
            color: var(--text-muted);
            min-height: 1.2em;
            padding: 0 2px;
        }

        .search-hint span {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── Right panel ── */
        .right-panel {
            flex: 1;
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 8px var(--shadow-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .results-header h2 {
            font-size: 1.2em;
            color: var(--text-primary);
        }

        .results-count {
            font-size: 1em;
            color: var(--text-secondary);
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding-top: 14px;
            border-top: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .pagination button {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
        }

        .pagination button:disabled {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }

        .page-info {
            font-size: 0.9em;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .results-scroll {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--surface-muted);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tbody tr:nth-child(even) {
            background: var(--surface-muted);
        }

        th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--row-border);
        }

        tr {
            transition: box-shadow 0.2s;
        }

        tbody tr:hover {
            position: relative;
            box-shadow: 0 3px 4px var(--row-hover-shadow), 0 -3px 4px var(--row-hover-shadow);
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.82em;
            font-weight: 600;
            width: min-content;
            text-align: center;
        }

        .badge-type {
            background: var(--badge-bg);
            color: var(--badge-text);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--loading-text);
            font-size: 1.1em;
        }

        .spinner {
            border: 4px solid var(--surface-muted);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.05em;
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 14px;
            border-radius: 8px;
        }

        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
        }

        /* ── Scrollbar styling ── */
        .results-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .results-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .results-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* ── Mobile: stack vertically ── */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .layout {
                flex-direction: column;
                gap: 10px;
                height: 100%;
            }

            .left-panel {
                width: 100%;
                flex-shrink: 0;
                gap: 10px;
            }

            .brand {
                padding: 12px 14px;
            }

            h1 {
                font-size: 1.3em;
                margin-bottom: 3px;
            }

            .subtitle {
                font-size: 0.82em;
            }

            .search-section {
                padding: 12px 14px;
                gap: 10px;
            }

            input[type="text"] {
                padding: 9px 11px;
                font-size: 14px;
            }

            button {
                padding: 9px 14px;
                font-size: 14px;
            }

            select {
                padding: 8px 11px;
                font-size: 13px;
            }

            .right-panel {
                flex: 1;
                min-height: 0;
                padding: 14px;
            }

            th, td {
                padding: 6px 8px;
                font-size: 0.95em;
            }

            table {
                width: fit-content
            }
        }
    </style>
</head>
<body>
    <div class="layout">

        <!-- Left panel: brand + search -->
        <aside class="left-panel">
            <div class="brand">
                <div class="brand-text">
                    <h1>📱 Phone Records</h1>
                    <p class="subtitle">Search across services and phone codes</p>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false">🌙</button>
            </div>

            <div class="search-section">
                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search…"
                        autocomplete="off"
                    >
                    <button onclick="performSearch()">🔍</button>
                </div>
                <p class="search-hint" id="searchHint"></p>

                <div class="filters">
                    <select id="typeFilter" onchange="filterByType()">
                        <option value="">All Types</option>
                    </select>
                    <select id="thresholdSelect" onchange="performSearch()">
                        <option value="0.6">Very Strict</option>
                        <option value="0.4">Normal</option>
                        <option value="0.3" selected>Fuzzy</option>
                        <option value="0.2">Very Fuzzy</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Right panel: results -->
        <main class="right-panel">
            <div class="results-header">
                <h2>Results</h2>
                <span class="results-count" id="resultsCount">0 records</span>
            </div>
            <div class="results-scroll" id="resultsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading phone records…
                </div>
            </div>
            <div class="pagination" id="pagination" style="display:none">
                <button id="btnFirst"  onclick="goToPage(1)"            >«</button>
                <button id="btnPrev"   onclick="goToPage(currentPage-1)">‹</button>
                <span class="page-info" id="pageInfo"></span>
                <button id="btnNext"   onclick="goToPage(currentPage+1)">›</button>
                <button id="btnLast"   onclick="goToPage(totalPages)"   >»</button>
            </div>
        </main>

    </div>

    <script>
        const API_BASE = '';
        const THEME_STORAGE_KEY = 'callcenter-theme';
        const PAGE_SIZE = 100;
        let allRecords = [];
        let currentRecords = [];
        let currentPage = 1;
        let totalPages = 1;

        // Standard Greek keyboard layout mapping (Latin key → Greek character)
        const LATIN_TO_GREEK = {
            'a':'α','b':'β','c':'ψ','d':'δ','e':'ε','f':'φ','g':'γ',
            'h':'η','i':'ι','j':'ξ','k':'κ','l':'λ','m':'μ','n':'ν',
            'o':'ο','p':'π','r':'ρ','s':'σ','t':'τ','u':'θ','v':'ω',
            'w':'ς','x':'χ','y':'υ','z':'ζ',
            'A':'Α','B':'Β','C':'Ψ','D':'Δ','E':'Ε','F':'Φ','G':'Γ',
            'H':'Η','I':'Ι','J':'Ξ','K':'Κ','L':'Λ','M':'Μ','N':'Ν',
            'O':'Ο','P':'Π','R':'Ρ','S':'Σ','T':'Τ','U':'Θ','V':'Ω',
            'X':'Χ','Y':'Υ','Z':'Ζ'
        };

        // Returns the converted query and whether conversion actually happened
        function toGreekQuery(text) {
            const hasGreek = /[\u0370-\u03FF\u1F00-\u1FFF]/.test(text);
            if (hasGreek) return { query: text, converted: false };
            const converted = text.split('').map(ch => LATIN_TO_GREEK[ch] ?? ch).join('');
            return { query: converted, converted: converted !== text };
        }

        function updateSearchHint(raw) {
            const hint = document.getElementById('searchHint');
            if (!raw) { hint.textContent = ''; return; }
            const { query, converted } = toGreekQuery(raw);
            hint.innerHTML = converted ? `Searching as: <span>${query}</span>` : '';
        }

        const highlightString = (text) => `<span class="highlight">${text}</span>`;
        const highlightStringAt = (text, indices) => {
            if (!indices || indices.length === 0) return text;

            const normalizedIndices = [...new Set(indices)]
                .filter(i => Number.isInteger(i) && i >= 0 && i < text.length)
                .sort((a, b) => a - b);

            if (normalizedIndices.length === 0) return text;

            let result = '';
            let lastIndex = 0;
            let rangeStart = normalizedIndices[0];
            let rangeEnd = normalizedIndices[0];

            for (let i = 1; i < normalizedIndices.length; i++) {
                const index = normalizedIndices[i];
                if (index === rangeEnd + 1) { rangeEnd = index; continue; }
                result += text.slice(lastIndex, rangeStart);
                result += highlightString(text.slice(rangeStart, rangeEnd + 1));
                lastIndex = rangeEnd + 1;
                rangeStart = index;
                rangeEnd = index;
            }

            result += text.slice(lastIndex, rangeStart);
            result += highlightString(text.slice(rangeStart, rangeEnd + 1));
            result += text.slice(rangeEnd + 1);
            return result;
        };

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            const themeToggle = document.getElementById('themeToggle');
            document.body.classList.toggle('dark-mode', isDark);
            if (themeToggle) {
                themeToggle.textContent = isDark ? '☀️' : '🌙';
                themeToggle.setAttribute('aria-pressed', String(isDark));
            }
        }

        function initializeTheme() {
            const saved = localStorage.getItem(THEME_STORAGE_KEY);
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved || (prefersDark ? 'dark' : 'light'));
        }

        function toggleTheme() {
            const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem(THEME_STORAGE_KEY, next);
        }

        async function init() {
            await loadTypes();
            await loadAllRecords();
        }

        async function loadTypes() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const stats = await response.json();
                const typeFilter = document.getElementById('typeFilter');
                stats.types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading types:', error);
            }
        }

        async function loadAllRecords() {
            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/records`);
                allRecords = await response.json();
                displayResults(allRecords);
            } catch (error) {
                showError('Failed to load records');
                console.error('Error loading records:', error);
            }
        }

        async function performSearch() {
            const raw = document.getElementById('searchInput').value.trim();
            if (!raw) { updateSearchHint(''); loadAllRecords(); return; }

            const { query } = toGreekQuery(raw);

            try {
                showLoading();
                const threshold = document.getElementById('thresholdSelect').value;
                const response = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}&threshold=${threshold}`);
                const results = await response.json();
                displayResults(results);
            } catch (error) {
                showError('Search failed');
                console.error('Error searching:', error);
            }
        }

        async function filterByType() {
            const type = document.getElementById('typeFilter').value;
            if (!type) { loadAllRecords(); return; }

            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/records/type?type=${encodeURIComponent(type)}`);
                const results = await response.json();
                displayResults(results);
            } catch (error) {
                showError('Failed to filter by type');
                console.error('Error filtering:', error);
            }
        }

        function displayResults(records) {
            currentRecords = records;
            currentPage = 1;
            totalPages = Math.max(1, Math.ceil(records.length / PAGE_SIZE));
            renderPage();
        }

        function goToPage(page) {
            currentPage = Math.min(Math.max(1, page), totalPages);
            renderPage();
            document.getElementById('resultsContainer').scrollTop = 0;
        }

        function renderPage() {
            const container = document.getElementById('resultsContainer');
            const countLabel = document.getElementById('resultsCount');
            const pagination = document.getElementById('pagination');

            countLabel.textContent = `${currentRecords.length} record${currentRecords.length !== 1 ? 's' : ''}`;

            if (currentRecords.length === 0) {
                container.innerHTML = '<div class="no-results">No records found</div>';
                pagination.style.display = 'none';
                return;
            }

            const start = (currentPage - 1) * PAGE_SIZE;
            const pageRecords = currentRecords.slice(start, start + PAGE_SIZE);

            const rows = pageRecords.map(record => {
                const { type, service, code, matchesIdx } = record;
                const matchesIdxService = matchesIdx && matchesIdx.filter(idx => idx < service.length);
                const matchesIdxCode = matchesIdx && matchesIdx.filter(idx => idx >= service.length).map(idx => idx - service.length - 1);
                return `
                    <tr>
                        <td><span class="badge badge-type">${type}</span></td>
                        <td>${matchesIdxService && highlightStringAt(service, matchesIdxService) || service}</td>
                        <td><strong>${matchesIdxCode && highlightStringAt(code, matchesIdxCode) || code}</strong></td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Service</th>
                            <th>Code</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;

            // Update pagination controls
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('btnFirst').disabled = currentPage === 1;
            document.getElementById('btnPrev').disabled  = currentPage === 1;
            document.getElementById('btnNext').disabled  = currentPage === totalPages;
            document.getElementById('btnLast').disabled  = currentPage === totalPages;
            pagination.style.display = totalPages > 1 ? 'flex' : 'none';
        }

        function showLoading() {
            document.getElementById('resultsContainer').innerHTML =
                '<div class="loading"><div class="spinner"></div>Loading…</div>';
        }

        function showError(message) {
            document.getElementById('resultsContainer').innerHTML =
                `<div class="error">⚠️ ${message}</div>`;
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { clearTimeout(searchDebounceTimer); performSearch(); }
        });

        let searchDebounceTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            updateSearchHint(e.target.value.trim());
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(performSearch, 500);
        });

        initializeTheme();
        init();
    </script>
</body>
</html>
