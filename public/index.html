<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Records Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #41509b;
            --bg-gradient-end: #513275;
            --surface: #f4f7fd;
            --surface-muted: #e1e7f2;
            --surface-hover: #d7e0ef;
            --text-primary: #222942;
            --text-secondary: #444f70;
            --text-muted: #596480;
            --accent: #3e54ad;
            --accent-hover: #364ea6;
            --border-color: #bcc8dc;
            --row-border: #ccd7e7;
            --badge-bg: #cfe2ff;
            --badge-text: #0f4f98;
            --loading-text: #535d7a;
            --error-bg: #ffd4dc;
            --error-text: #8f1d2b;
            --highlight-bg: #ffd96a;
            --highlight-text: #534200;
            --shadow-color: rgba(15, 26, 52, 0.2);
        }

        body.dark-mode {
            --bg-gradient-start: #151d31;
            --bg-gradient-end: #232038;
            --surface: #1f2638;
            --surface-muted: #2a3146;
            --surface-hover: #323a52;
            --text-primary: #edf1ff;
            --text-secondary: #c8d0ed;
            --text-muted: #a7b0cf;
            --accent: #8ea6ff;
            --accent-hover: #7b95f5;
            --border-color: #3a435f;
            --row-border: #313953;
            --badge-bg: #2a3c67;
            --badge-text: #bdd5ff;
            --loading-text: #c2cae5;
            --error-bg: #4b2230;
            --error-text: #ffd0db;
            --highlight-bg: #5a4a17;
            --highlight-text: #ffecac;
            --shadow-color: rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px var(--shadow-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        h1 {
            color: var(--accent);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .theme-toggle {
            padding: 10px 16px;
            font-size: 14px;
            white-space: nowrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px var(--shadow-color);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.9em;
        }

        .search-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            transition: border-color 0.3s;
            background: var(--surface);
            color: var(--text-primary);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
        }

        .results {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .results-count {
            font-size: 1.2em;
            color: var(--text-secondary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--surface-muted);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--row-border);
        }

        tr:hover {
            background: var(--surface-hover);
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-type {
            background: var(--badge-bg);
            color: var(--badge-text);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--loading-text);
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid var(--surface-muted);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1em;
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            .theme-toggle {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>📱 Phone Records Search</h1>
                <p class="subtitle">Fuzzy search across phone services and codes</p>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false">🌙 Dark Mode</button>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalRecords">-</div>
                <div class="stat-label">Total Records</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueTypes">-</div>
                <div class="stat-label">Unique Types</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueServices">-</div>
                <div class="stat-label">Unique Services</div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for services or codes (e.g., 'mobile', 'emergency', '911')..."
                    autocomplete="off"
                >
                <button onclick="performSearch()">🔍 Search</button>
            </div>

            <div class="filters">
                <select id="typeFilter" onchange="filterByType()">
                    <option value="">All Types</option>
                </select>
                <select id="thresholdSelect" onchange="performSearch()">
                    <option value="0.2">Very Strict</option>
                    <option value="0.4" selected>Normal</option>
                    <option value="0.6">Fuzzy</option>
                    <option value="0.8">Very Fuzzy</option>
                </select>
            </div>
        </div>

        <div class="results">
            <div class="results-header">
                <h2>Results</h2>
                <span class="results-count" id="resultsCount">0 records</span>
            </div>
            <div id="resultsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading phone records...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        const THEME_STORAGE_KEY = 'callcenter-theme';
        let allRecords = [];

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            const themeToggle = document.getElementById('themeToggle');

            document.body.classList.toggle('dark-mode', isDark);

            if (themeToggle) {
                themeToggle.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
                themeToggle.setAttribute('aria-pressed', String(isDark));
            }
        }

        function initializeTheme() {
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');

            applyTheme(initialTheme);
        }

        function toggleTheme() {
            const nextTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
            applyTheme(nextTheme);
            localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        }

        // Load initial data
        async function init() {
            await loadStats();
            await loadAllRecords();
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const stats = await response.json();

                document.getElementById('totalRecords').textContent = stats.total;
                document.getElementById('uniqueTypes').textContent = stats.uniqueTypes;
                document.getElementById('uniqueServices').textContent = stats.uniqueServices;

                // Populate filters
                const typeFilter = document.getElementById('typeFilter');
                stats.types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeFilter.appendChild(option);
                });

                const serviceFilter = document.getElementById('serviceFilter');
                stats.services.forEach(service => {
                    const option = document.createElement('option');
                    option.value = service;
                    option.textContent = service;
                    serviceFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load all records
        async function loadAllRecords() {
            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/records`);
                allRecords = await response.json();
                displayResults(allRecords);
            } catch (error) {
                showError('Failed to load records');
                console.error('Error loading records:', error);
            }
        }

        // Perform fuzzy search
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                loadAllRecords();
                return;
            }

            try {
                showLoading();
                const threshold = document.getElementById('thresholdSelect').value;
                const response = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}&threshold=${threshold}`);
                const results = await response.json();
                displayResults(results);
            } catch (error) {
                showError('Search failed');
                console.error('Error searching:', error);
            }
        }

        // Filter by type
        async function filterByType() {
            const type = document.getElementById('typeFilter').value;
            
            if (!type) {
                loadAllRecords();
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/records/type?type=${encodeURIComponent(type)}`);
                const results = await response.json();
                displayResults(results);
            } catch (error) {
                showError('Failed to filter by type');
                console.error('Error filtering:', error);
            }
        }

        // Highlight matching text (fuzzy)
        function highlightText(text, query) {
            if (!query || !text) return text;
            


            const lowerText = text.toLowerCase();
            const lowerQuery = query.toLowerCase();
            
            for (let i = 0; i < lowerQuery.length; i++) {
                for (let j = 0; j < lowerText.length; j++) {
                    if (lowerQuery[i] === lowerText[j]) {
                        text 
                    }
                }
            }

            // Try exact match first
            if (lowerText.includes(lowerQuery)) {
                const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escapedQuery})`, 'gi');
                return text.replace(regex, '<span class="highlight">$1</span>');
            }
            
            // Fuzzy matching: highlight characters that match in sequence
            let result = '';
            let queryIndex = 0;
            
            for (let i = 0; i < text.length; i++) {
                if (queryIndex < lowerQuery.length && 
                    lowerText[i] === lowerQuery[queryIndex]) {
                    result += `<span class="highlight">${text[i]}</span>`;
                    queryIndex++;
                } else {
                    result += text[i];
                }
            }
            
            return result;
        }

        // Display results
        function displayResults(records) {
            const container = document.getElementById('resultsContainer');
            const countLabel = document.getElementById('resultsCount');
            const query = document.getElementById('searchInput').value.trim();

            countLabel.textContent = `${records.length} record${records.length !== 1 ? 's' : ''}`;

            if (records.length === 0) {
                container.innerHTML = '<div class="no-results">No records found</div>';
                return;
            }

            const table = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>Service</th>
                            <th>Code</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${records.map(record => `
                            <tr>
                                <td>${record.id}</td>
                                <td><span class="badge badge-type">${highlightText(record.type, query)}</span></td>
                                <td>${highlightText(record.service, query)}</td>
                                <td><strong>${highlightText(record.code, query)}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = table;
        }

        // Show loading state
        function showLoading() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
        }

        // Show error
        function showError(message) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }

        // Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Initialize on page load
        initializeTheme();
        init();
    </script>
</body>
</html>
