<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Records Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .search-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            font-size: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .results {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .results-count {
            font-size: 1.2em;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f5f5f5;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-type {
            background: #e3f2fd;
            color: #1976d2;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .highlight {
            background-color: #fff59d;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 Phone Records Search</h1>
            <p class="subtitle">Fuzzy search across phone services and codes</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalRecords">-</div>
                <div class="stat-label">Total Records</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueTypes">-</div>
                <div class="stat-label">Unique Types</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueServices">-</div>
                <div class="stat-label">Unique Services</div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for services or codes (e.g., 'mobile', 'emergency', '911')..."
                    autocomplete="off"
                >
                <button onclick="performSearch()">🔍 Search</button>
                <button onclick="loadAllRecords()">📋 Show All</button>
            </div>

            <div class="filters">
                <select id="typeFilter" onchange="filterByType()">
                    <option value="">All Types</option>
                </select>
                <select id="serviceFilter" onchange="filterByService()">
                    <option value="">All Services</option>
                </select>
                <select id="thresholdSelect" onchange="performSearch()">
                    <option value="0.2">Very Strict</option>
                    <option value="0.4" selected>Normal</option>
                    <option value="0.6">Fuzzy</option>
                    <option value="0.8">Very Fuzzy</option>
                </select>
            </div>
        </div>

        <div class="results">
            <div class="results-header">
                <h2>Results</h2>
                <span class="results-count" id="resultsCount">0 records</span>
            </div>
            <div id="resultsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading phone records...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let allRecords = [];

        // Load initial data
        async function init() {
            await loadStats();
            await loadAllRecords();
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const stats = await response.json();

                document.getElementById('totalRecords').textContent = stats.total;
                document.getElementById('uniqueTypes').textContent = stats.uniqueTypes;
                document.getElementById('uniqueServices').textContent = stats.uniqueServices;

                // Populate filters
                const typeFilter = document.getElementById('typeFilter');
                stats.types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeFilter.appendChild(option);
                });

                const serviceFilter = document.getElementById('serviceFilter');
                stats.services.forEach(service => {
                    const option = document.createElement('option');
                    option.value = service;
                    option.textContent = service;
                    serviceFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load all records
        async function loadAllRecords() {
            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/records`);
                allRecords = await response.json();
                displayResults(allRecords);
            } catch (error) {
                showError('Failed to load records');
                console.error('Error loading records:', error);
            }
        }

        // Perform fuzzy search
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                loadAllRecords();
                return;
            }

            try {
                showLoading();
                const threshold = document.getElementById('thresholdSelect').value;
                const response = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}&threshold=${threshold}`);
                const results = await response.json();
                displayResults(results);
            } catch (error) {
                showError('Search failed');
                console.error('Error searching:', error);
            }
        }

        // Filter by type
        async function filterByType() {
            const type = document.getElementById('typeFilter').value;
            
            if (!type) {
                loadAllRecords();
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/records/type?type=${encodeURIComponent(type)}`);
                const results = await response.json();
                displayResults(results);
            } catch (error) {
                showError('Failed to filter by type');
                console.error('Error filtering:', error);
            }
        }

        // Filter by service
        async function filterByService() {
            const service = document.getElementById('serviceFilter').value;
            
            if (!service) {
                loadAllRecords();
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${API_BASE}/api/records/service?service=${encodeURIComponent(service)}`);
                const results = await response.json();
                displayResults(results);
            } catch (error) {
                showError('Failed to filter by service');
                console.error('Error filtering:', error);
            }
        }

        // Highlight matching text
        function highlightText(text, query) {
            if (!query || !text) return text;
            
            // Escape special regex characters in query
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            
            // Create a case-insensitive regex to find all matches
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Display results
        function displayResults(records) {
            const container = document.getElementById('resultsContainer');
            const countLabel = document.getElementById('resultsCount');
            const query = document.getElementById('searchInput').value.trim();

            countLabel.textContent = `${records.length} record${records.length !== 1 ? 's' : ''}`;

            if (records.length === 0) {
                container.innerHTML = '<div class="no-results">No records found</div>';
                return;
            }

            const table = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>Service</th>
                            <th>Code</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${records.map(record => `
                            <tr>
                                <td>${record.id}</td>
                                <td><span class="badge badge-type">${highlightText(record.type, query)}</span></td>
                                <td>${highlightText(record.service, query)}</td>
                                <td><strong>${highlightText(record.code, query)}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = table;
        }

        // Show loading state
        function showLoading() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
        }

        // Show error
        function showError(message) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }

        // Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Initialize on page load
        init();
    </script>
</body>
</html>
