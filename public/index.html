<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>251 ΓΝΑ CallCenter</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#41509b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CallCenter">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #41509b;
            --bg-gradient-end: #513275;
            --surface: #d8dadc;
            --surface-muted: #cacdd0;
            --surface-muted-th: #c6cad3;
            --surface-hover: #bdc5d2;
            --text-primary: #222942;
            --text-secondary: #444f70;
            --text-muted: #596480;
            --accent: #3e54ad;
            --accent-hover: #364ea6;
            --border-color: #bcc8dc;
            --row-border: #ccd7e7;
            --badge-bg: #cfe2ff;
            --badge-text: #0f4f98;
            --loading-text: #535d7a;
            --error-bg: #ffd4dc;
            --error-text: #8f1d2b;
            --highlight-bg: #ffd96a;
            --highlight-text: #534200;
            --restricted-bg: rgba(220, 50, 50, 0.08);
            --restricted-badge-bg: #f5c2c7;
            --restricted-badge-text: #842029;
            --shadow-color: rgba(15, 26, 52, 0.2);
            --row-hover-shadow: rgba(15, 26, 52, 0.18);
        }

        body.dark-mode {
            --bg-gradient-start: #151d31;
            --bg-gradient-end: #232038;
            --surface: #1f2638;
            --surface-muted: #2a3146;
            --surface-hover: #323a52;
            --text-primary: #edf1ff;
            --text-secondary: #c8d0ed;
            --text-muted: #a7b0cf;
            --accent: #8ea6ff;
            --accent-hover: #7b95f5;
            --border-color: #3a435f;
            --row-border: #313953;
            --badge-bg: #2a3c67;
            --badge-text: #bdd5ff;
            --loading-text: #c2cae5;
            --error-bg: #4b2230;
            --error-text: #ffd0db;
            --highlight-bg: #5a4a17;
            --highlight-text: #ffecac;
            --restricted-bg: rgba(220, 50, 50, 0.12);
            --restricted-badge-bg: #5c1f26;
            --restricted-badge-text: #f5c2c7;
            --shadow-color: rgba(0, 0, 0, 0.35);
            --row-hover-shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            height: 100dvh;
            overflow: hidden;
            padding: 20px;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            display: flex;
            align-items: stretch;
        }

        .layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Left panel ── */
        .left-panel {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px 32px;
            box-shadow: 0 4px 8px var(--shadow-color);
            text-align: center;
            align-self: center;
        }

        h1 {
            color: var(--accent);
            font-size: 1.8em;
            line-height: 1.2;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 38px;
            height: 38px;
            padding: 0;
            font-size: 18px;
            background: var(--surface-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 2px 6px var(--shadow-color);
        }

        .search-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 8px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            transition: border-color 0.3s;
            background: var(--surface);
            color: var(--text-primary);
            min-width: 0;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            padding: 12px 18px;
            font-size: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
        }

        .search-hint {
            font-size: 0.82em;
            color: var(--text-muted);
            min-height: 1.2em;
            padding: 0 2px;
        }

        .search-hint span {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── Right panel ── */
        .right-panel {
            flex: 1;
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 8px var(--shadow-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .results-header h2 {
            font-size: 1.2em;
            color: var(--text-primary);
        }

        .results-count {
            font-size: 1em;
            color: var(--text-secondary);
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding-top: 14px;
            border-top: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .pagination button {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
        }

        .pagination button:disabled {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }

        .page-info {
            font-size: 0.9em;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .results-scroll {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--surface-muted);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tbody tr:nth-child(even) {
            background: var(--surface-muted);
        }

        th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--row-border);
        }

        tr {
            transition: box-shadow 0.2s;
        }

        tbody tr:hover {
            position: relative;
            box-shadow: 0 3px 4px var(--row-hover-shadow), 0 -3px 4px var(--row-hover-shadow);
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.82em;
            font-weight: 600;
            width: min-content;
            text-align: center;
        }

        .badge-type {
            background: var(--badge-bg);
            color: var(--badge-text);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--loading-text);
            font-size: 1.1em;
        }

        .spinner {
            border: 4px solid var(--surface-muted);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.05em;
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 14px;
            border-radius: 8px;
        }

        .restricted {
            background: var(--restricted-bg) !important;
        }

        .restricted-badge {
            display: inline-block;
            font-size: 0.72em;
            font-weight: 700;
            color: var(--restricted-badge-text);
            background: var(--restricted-badge-bg);
            border-radius: 4px;
            padding: 1px 5px;
            margin-left: 6px;
            vertical-align: middle;
            letter-spacing: 0.03em;
        }
        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
        }

        .merged-services {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 2px 0;
        }

        .service-chip {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--surface-muted);
            color: var(--text-primary);
            font-size: 0.82em;
            box-shadow: 0 2px 5px var(--shadow-color);
            white-space: nowrap;
        }

        /* ── Middle row (search + latest) ── */
        .middle-row {
            display: contents;
        }

        /* ── Latest island ── */
        .latest-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 4px 8px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .latest-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .latest-title {
            font-size: 1em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .latest-subtitle {
            font-size: 0.78em;
            color: var(--text-muted);
        }

        .latest-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .latest-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: var(--surface-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .latest-item:hover {
            background: var(--surface-hover);
        }

        .latest-rank {
            font-size: 0.75em;
            font-weight: 700;
            color: var(--text-muted);
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        .latest-item-info {
            flex: 1;
            min-width: 0;
        }

        .latest-service {
            font-size: 0.82em;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .latest-code {
            font-size: 0.9em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .latest-count {
            font-size: 0.75em;
            font-weight: 700;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 3px 8px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .latest-delete {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            padding: 0;
            font-size: 13px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            cursor: pointer;
        }

        .latest-delete:hover {
            color: var(--error-text);
            background: var(--error-bg);
        }

        .latest-empty {
            font-size: 0.85em;
            color: var(--text-muted);
            text-align: center;
            padding: 8px 0;
        }

        /* ── Scrollbar styling ── */
        .results-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .results-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .results-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* ── Mobile: stack vertically ── */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .layout {
                flex-direction: column;
                gap: 10px;
                height: 100%;
            }

            .left-panel {
                width: 100%;
                flex-shrink: 0;
                gap: 10px;
            }

            h1 {
                font-size: 1.3em;
            }

            .theme-toggle {
                top: 20px;
                right: 15px;
            }

            .search-section {
                padding: 12px 14px;
                gap: 10px;
            }

            input[type="text"] {
                padding: 9px 11px;
                font-size: 14px;
            }

            button {
                padding: 9px 14px;
                font-size: 14px;
            }

            select {
                padding: 8px 11px;
                font-size: 13px;
            }

            .right-panel {
                flex: 1;
                min-height: 0;
                padding: 14px;
            }

            .middle-row {
                max-height: 200px;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }

            .middle-row .search-section {
                flex: 1;
                min-width: 0;
            }

            .middle-row .latest-section {
                flex: 1;
                min-width: 0;
                min-height: 0;
                padding: 12px 14px;
                overflow: hidden;
            }

            .middle-row .latest-section .latest-list {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }

            .middle-row .latest-item {
                padding: 5px 7px;
                gap: 7px;
            }

            .middle-row .latest-service {
                font-size: 0.75em;
            }

            .middle-row .latest-code {
                font-size: 0.8em;
            }

            .middle-row .latest-count {
                font-size: 0.7em;
                padding: 2px 5px;
            }

            th, td {
                padding: 6px 8px;
                font-size: 0.95em;
            }

            table {
                width: fit-content
            }
        }
    </style>
</head>
<body>
        <!-- Dark mode toggle (top-right, fixed) -->
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false">🌙</button>

        <div class="layout">

        <!-- Left panel: brand + search -->
        <aside class="left-panel">
            <div class="brand">
                <h1>251 ΓΝΑ CallCenter</h1>
            </div>

            <div class="middle-row">
                <div class="search-section">
                    <div class="search-box">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search…"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                        >
                        <button onclick="performSearch()">🔍</button>
                    </div>
                    <p class="search-hint" id="searchHint"></p>

                    <div class="filters">
                        <select id="typeFilter" onchange="filterByType()">
                            <option value="">All Types</option>
                        </select>
                        <select id="thresholdSelect" onchange="performSearch()">
                            <option value="0.6">Very Strict</option>
                            <option value="0.4">Normal</option>
                            <option value="0.3" selected>Fuzzy</option>
                            <option value="0.2">Very Fuzzy</option>
                        </select>
                    </div>
                </div>

                <div class="latest-section" id="latestSection">
                    <div class="latest-header">
                        <span class="latest-title">Latest</span>
                        <span class="latest-subtitle">Today's top requests</span>
                    </div>
                    <div class="latest-list" id="latestList">
                        <div class="latest-empty">No requests yet today</div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="right-panel">
            <div class="results-header">
                <h2>Results</h2>
                <span class="results-count" id="resultsCount">0 records</span>
            </div>
            <div class="results-scroll" id="resultsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading phone records…
                </div>
            </div>
            <div class="pagination" id="pagination" style="display:none">
                <button id="btnFirst"  onclick="goToPage(1)"            >«</button>
                <button id="btnPrev"   onclick="goToPage(currentPage-1)">‹</button>
                <span class="page-info" id="pageInfo"></span>
                <button id="btnNext"   onclick="goToPage(currentPage+1)">›</button>
                <button id="btnLast"   onclick="goToPage(totalPages)"   >»</button>
            </div>
        </main>

    </div>

    <script>
        const API_BASE = '';
        const THEME_STORAGE_KEY = 'callcenter-theme';
        const PAGE_SIZE = 100;
        let allRecords = [];
        let currentRecords = [];
        let currentPage = 1;
        let totalPages = 1;
        let activeQuery = '';

        // ── IndexedDB cache helpers ──────────────────────────────────────────
        const IDB_NAME    = 'callcenter-cache';
        const IDB_VERSION = 1;

        function openIDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('records')) {
                        db.createObjectStore('records', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('meta')) {
                        db.createObjectStore('meta');
                    }
                };
                req.onsuccess = e => resolve(e.target.result);
                req.onerror   = () => reject(req.error);
            });
        }

        function idbGet(db, storeName, key) {
            return new Promise((resolve, reject) => {
                const req = db.transaction(storeName, 'readonly').objectStore(storeName).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror   = () => reject(req.error);
            });
        }

        function idbGetAll(db, storeName) {
            return new Promise((resolve, reject) => {
                const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror   = () => reject(req.error);
            });
        }

        function idbPut(db, storeName, key, value) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                tx.objectStore(storeName).put(value, key);
                tx.oncomplete = () => resolve();
                tx.onerror    = () => reject(tx.error);
            });
        }

        // Clears the store then writes all items in a single transaction
        function idbPutAll(db, storeName, items) {
            return new Promise((resolve, reject) => {
                const tx    = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                store.clear();
                for (const item of items) store.put(item);
                tx.oncomplete = () => resolve();
                tx.onerror    = () => reject(tx.error);
            });
        }

        // ── Client-side fuzzy search (ported from src/fuzzy_search.ts) ───────
        class FuzzySearch {
            constructor(data) { this.data = data; }

            _customDistance(q, s) {
                let distance = 0;
                let lastMatchIndex = -1;
                let matchedChars = 0;
                const matchesIdx = [];
                outer:
                for (let i = 0; i < q.length; i++) {
                    const qChar = q.charAt(i);
                    let found = false;
                    for (let j = lastMatchIndex + 1; j < s.length; j++) {
                        if (qChar === s.charAt(j)) {
                            lastMatchIndex = j;
                            matchesIdx.push(j);
                            matchedChars++;
                            found = true;
                            continue outer;
                        } else {
                            distance += 1;
                        }
                    }
                    if (!found) distance += s.length;
                }
                distance += s.length - matchedChars;
                return [distance, matchesIdx];
            }

            search(query, threshold = 0.3) {
                const results = this.data
                    .map((item, index) => {
                        const [distance, matchesIdx] = this._customDistance(
                            query.toLowerCase(), item.toLowerCase()
                        );
                        const maxLen = Math.max(query.length, item.length);
                        const score  = Math.exp(-distance / (maxLen * 2));
                        return { item, score, matchesIdx, index };
                    })
                    .filter(r => r.score >= threshold);
                results.sort((a, b) => b.score - a.score);
                return results.map(r => ({ item: r.item, matchesIdx: r.matchesIdx, index: r.index }));
            }
        }

        // Replicates phone_repository.ts fuzzySearch() entirely on the client
        function clientFuzzySearch(records, query, threshold = 0.4) {
            const searchableItems = [];
            const itemToRecord    = [];

            for (const record of records) {
                if (record.merged) {
                    const services = JSON.parse(record.service);
                    for (const s of services) {
                        searchableItems.push(`${s} ${record.code}`);
                        itemToRecord.push(record);
                    }
                } else {
                    searchableItems.push(`${record.service} ${record.code}`);
                    itemToRecord.push(record);
                }
            }

            const fuzzy   = new FuzzySearch(searchableItems);
            const results = fuzzy.search(query, threshold);

            const seen = new Set();
            return results.flatMap(result => {
                const record = itemToRecord[result.index];
                if (!record || seen.has(record.id)) return [];
                seen.add(record.id);
                const matchesIdx = record.merged ? [] : result.matchesIdx;
                return [{ ...record, matchesIdx }];
            });
        }

        // ── Records cache loader ─────────────────────────────────────────────
        async function loadRecordsWithCache() {
            showLoading();
            try {
                const [idb, hashRes] = await Promise.all([
                    openIDB(),
                    fetch(`${API_BASE}/api/records/hash`)
                ]);
                const { hash: serverHash } = await hashRes.json();
                const cachedHash = await idbGet(idb, 'meta', 'hash');

                if (cachedHash === serverHash) {
                    allRecords = await idbGetAll(idb, 'records');
                } else {
                    const res = await fetch(`${API_BASE}/api/records`);
                    allRecords = await res.json();
                    await idbPutAll(idb, 'records', allRecords);
                    await idbPut(idb, 'meta', 'hash', serverHash);
                }
                displayResults(allRecords);
            } catch (error) {
                showError('Failed to load records');
                console.error('Error loading records:', error);
            }
        }

        const RESTRICTED_CODES = new Set(['3995','3955','3953','3738','3974','3780','3808','3535','3915','1745','3997','3598']);

        // Standard Greek keyboard layout mapping (Latin key → Greek character)
        const LATIN_TO_GREEK = {
            'a':'α','b':'β','c':'ψ','d':'δ','e':'ε','f':'φ','g':'γ',
            'h':'η','i':'ι','j':'ξ','k':'κ','l':'λ','m':'μ','n':'ν',
            'o':'ο','p':'π','r':'ρ','s':'σ','t':'τ','u':'θ','v':'ω',
            'w':'ς','x':'χ','y':'υ','z':'ζ',
            'A':'Α','B':'Β','C':'Ψ','D':'Δ','E':'Ε','F':'Φ','G':'Γ',
            'H':'Η','I':'Ι','J':'Ξ','K':'Κ','L':'Λ','M':'Μ','N':'Ν',
            'O':'Ο','P':'Π','R':'Ρ','S':'Σ','T':'Τ','U':'Θ','V':'Ω',
            'X':'Χ','Y':'Υ','Z':'Ζ'
        };

        // Returns the converted query and whether conversion actually happened
        function toGreekQuery(text) {
            const hasGreek = /[\u0370-\u03FF\u1F00-\u1FFF]/.test(text);
            if (hasGreek) return { query: text, converted: false };
            const converted = text.split('').map(ch => LATIN_TO_GREEK[ch] ?? ch).join('');
            return { query: converted, converted: converted !== text };
        }

        function updateSearchHint(raw) {
            const hint = document.getElementById('searchHint');
            if (!raw) { hint.textContent = ''; return; }
            const { query, converted } = toGreekQuery(raw);
            hint.innerHTML = converted ? `Searching as: <span>${query}</span>` : '';
        }

        // Ported from src/fuzzy_search.ts — used for per-chip highlighting in merged rows
        function fuzzyMatchIndices(query, subject) {
            const q = query.toLowerCase();
            const s = subject.toLowerCase();
            let lastMatchIndex = -1;
            let matchedChars = 0;
            const matchesIdx = [];
            outer:
            for (let i = 0; i < q.length; i++) {
                const qChar = q[i];
                for (let j = lastMatchIndex + 1; j < s.length; j++) {
                    if (qChar === s[j]) {
                        lastMatchIndex = j;
                        matchesIdx.push(j);
                        matchedChars++;
                        continue outer;
                    }
                }
            }
            return matchedChars > 0 ? matchesIdx : [];
        }

        const highlightString = (text) => `<span class="highlight">${text}</span>`;
        const highlightStringAt = (text, indices) => {
            if (!indices || indices.length === 0) return text;

            const normalizedIndices = [...new Set(indices)]
                .filter(i => Number.isInteger(i) && i >= 0 && i < text.length)
                .sort((a, b) => a - b);

            if (normalizedIndices.length === 0) return text;

            let result = '';
            let lastIndex = 0;
            let rangeStart = normalizedIndices[0];
            let rangeEnd = normalizedIndices[0];

            for (let i = 1; i < normalizedIndices.length; i++) {
                const index = normalizedIndices[i];
                if (index === rangeEnd + 1) { rangeEnd = index; continue; }
                result += text.slice(lastIndex, rangeStart);
                result += highlightString(text.slice(rangeStart, rangeEnd + 1));
                lastIndex = rangeEnd + 1;
                rangeStart = index;
                rangeEnd = index;
            }

            result += text.slice(lastIndex, rangeStart);
            result += highlightString(text.slice(rangeStart, rangeEnd + 1));
            result += text.slice(rangeEnd + 1);
            return result;
        };

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            const themeToggle = document.getElementById('themeToggle');
            document.body.classList.toggle('dark-mode', isDark);
            if (themeToggle) {
                themeToggle.textContent = isDark ? '☀️' : '🌙';
                themeToggle.setAttribute('aria-pressed', String(isDark));
            }
        }

        function initializeTheme() {
            const saved = localStorage.getItem(THEME_STORAGE_KEY);
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved || (prefersDark ? 'dark' : 'light'));
        }

        function toggleTheme() {
            const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem(THEME_STORAGE_KEY, next);
        }

        async function init() {
            await loadTypes();
            await Promise.all([loadRecordsWithCache(), loadLatest()]);
        }

        async function loadTypes() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const stats = await response.json();
                const typeFilter = document.getElementById('typeFilter');
                stats.types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading types:', error);
            }
        }

        function loadAllRecords() {
            activeQuery = '';
            displayResults(allRecords);
        }

        function performSearch() {
            const raw = document.getElementById('searchInput').value.trim();
            if (!raw) { updateSearchHint(''); loadAllRecords(); return; }

            const { query } = toGreekQuery(raw);
            activeQuery = query;

            const threshold = parseFloat(document.getElementById('thresholdSelect').value);
            const results   = clientFuzzySearch(allRecords, query, threshold);
            displayResults(results);
        }

        function filterByType() {
            const type = document.getElementById('typeFilter').value;
            activeQuery = '';
            if (!type) {
                displayResults(allRecords);
            } else {
                displayResults(allRecords.filter(r => r.type === type));
            }
        }

        function displayResults(records) {
            currentRecords = records;
            currentPage = 1;
            totalPages = Math.max(1, Math.ceil(records.length / PAGE_SIZE));
            renderPage();
        }

        function goToPage(page) {
            currentPage = Math.min(Math.max(1, page), totalPages);
            renderPage();
            document.getElementById('resultsContainer').scrollTop = 0;
        }

        function renderPage() {
            const container = document.getElementById('resultsContainer');
            const countLabel = document.getElementById('resultsCount');
            const pagination = document.getElementById('pagination');

            countLabel.textContent = `${currentRecords.length} record${currentRecords.length !== 1 ? 's' : ''}`;

            if (currentRecords.length === 0) {
                container.innerHTML = '<div class="no-results">No records found</div>';
                pagination.style.display = 'none';
                return;
            }

            const start = (currentPage - 1) * PAGE_SIZE;
            const pageRecords = currentRecords.slice(start, start + PAGE_SIZE);

            const rows = pageRecords.map(record => {
                const { type, service, code, merged, matchesIdx } = record;
                const restricted = RESTRICTED_CODES.has(code);

                let serviceHtml;
                if (merged) {
                    const services = JSON.parse(service);
                    const chips = services.map(s => {
                        const indices = activeQuery ? fuzzyMatchIndices(activeQuery, s) : [];
                        const inner = indices.length ? highlightStringAt(s, indices) : s;
                        return `<span class="service-chip">${inner}</span>`;
                    }).join('');
                    serviceHtml = `<div class="merged-services">${chips}</div>`;
                } else {
                    const matchesIdxService = matchesIdx && matchesIdx.filter(idx => idx < service.length);
                    serviceHtml = (matchesIdxService && highlightStringAt(service, matchesIdxService) || service)
                        + (restricted ? '<span class="restricted-badge">ΜΗ ΔΙΑΘΕΣΙΜΟ</span>' : '');
                }

                const matchesIdxCode = !merged && matchesIdx && matchesIdx.filter(idx => idx >= service.length).map(idx => idx - service.length - 1);
                const codeHtml = matchesIdxCode && highlightStringAt(code, matchesIdxCode) || code;

                return `
                    <tr${restricted ? ' class="restricted"' : ''} data-type="${type}" data-service="${service}" data-code="${code}">
                        <td><span class="badge badge-type">${type}</span></td>
                        <td>${serviceHtml}</td>
                        <td><strong>${codeHtml}</strong></td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Service</th>
                            <th>Code</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;

            // Update pagination controls
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('btnFirst').disabled = currentPage === 1;
            document.getElementById('btnPrev').disabled  = currentPage === 1;
            document.getElementById('btnNext').disabled  = currentPage === totalPages;
            document.getElementById('btnLast').disabled  = currentPage === totalPages;
            pagination.style.display = totalPages > 1 ? 'flex' : 'none';
        }

        function showLoading() {
            document.getElementById('resultsContainer').innerHTML =
                '<div class="loading"><div class="spinner"></div>Loading…</div>';
        }

        function showError(message) {
            document.getElementById('resultsContainer').innerHTML =
                `<div class="error">⚠️ ${message}</div>`;
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { clearTimeout(searchDebounceTimer); performSearch(); }
        });

        let searchDebounceTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            updateSearchHint(e.target.value.trim());
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(performSearch, 500);
        });

        // ── Latest island ──
        async function loadLatest() {
            try {
                const response = await fetch(`${API_BASE}/api/latest`);
                const entries = await response.json();
                renderLatest(entries);
            } catch (error) {
                console.error('Error loading latest:', error);
            }
        }

        function renderLatest(entries) {
            const list = document.getElementById('latestList');

            if (!entries || entries.length === 0) {
                list.innerHTML = '<div class="latest-empty">No requests yet today</div>';
                return;
            }

            list.innerHTML = entries.map((e, i) => `
                <div class="latest-item"
                     data-service="${e.service}"
                     onclick="doLatestClick(this)">
                    <span class="latest-rank">${i + 1}</span>
                    <div class="latest-item-info">
                        <div class="latest-service">${e.service}</div>
                        <div class="latest-code">${e.code}</div>
                    </div>
                    <span class="latest-count">${e.count}×</span>
                    <button class="latest-delete" title="Remove"
                            onclick="event.stopPropagation(); deleteLatestEntry('${e.type}', '${e.service}', '${e.code}')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg></button>
                </div>
            `).join('');
        }

        // Clicking a Latest item fills the search box and searches
        function doLatestClick(el) {
            const { service } = el.dataset;
            const input = document.getElementById('searchInput');
            input.value = service;
            updateSearchHint(service);
            performSearch();
        }

        async function deleteLatestEntry(type, service, code) {
            try {
                await fetch(`${API_BASE}/api/latest`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, service, code })
                });
                loadLatest();
            } catch (error) {
                console.error('Error deleting latest entry:', error);
            }
        }

        // Delegated click on results table rows — POST to API, then refresh Latest
        document.getElementById('resultsContainer').addEventListener('click', async (e) => {
            const row = e.target.closest('tr[data-service]');
            if (!row) return;
            const { type, service, code } = row.dataset;
            try {
                await fetch(`${API_BASE}/api/latest`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, service, code })
                });
                loadLatest();
            } catch (error) {
                console.error('Error tracking latest:', error);
            }
        });

        initializeTheme();
        init();
        setInterval(loadLatest, 30000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
