<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
      (function(){var t=localStorage.getItem('callcenter-theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}if(t==='dark'){document.documentElement.classList.add('dark-mode');}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>251 ΓΝΑ CallCenter</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#41509b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CallCenter">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
    <link rel="stylesheet" href="/css/shared/reset.css">
    <link rel="stylesheet" href="/css/shared/theme.css">
    <link rel="stylesheet" href="/css/index/main.css">
</head>
<body>
        <div class="layout">

        <!-- Left panel: brand + actions + search -->
        <aside class="left-panel">
            <div class="brand-group">
                <div class="brand">
                    <h1>251 ΓΝΑ CallCenter</h1>
                </div>
                <div class="panel-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false"><svg class="btn-icon theme-icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="btn-icon theme-icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> Σκούρα εμφάνιση</button>
                    <button class="logout-btn" id="logoutBtn" onclick="logout()" aria-label="Logout" title="Αποσύνδεση"><svg class="btn-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Αποσύνδεση</button>
                </div>
            </div>
        </aside>
        <div class="right-wrapper">
        <div class="search-section">
                    <div class="search-row">
                        <div class="type-pill-wrapper">
                            <div class="type-pill" id="typePillDisplay">Όλα</div>
                            <select id="typeFilter" class="type-pill-select">
                                <option value="">Όλα</option>
                            </select>
                        </div>
                        <div class="search-box">
                            <input
                                type="text"
                                id="searchInput"
                                placeholder="Αναζήτηση…"
                                autocomplete="off"
                                autocorrect="off"
                                autocapitalize="off"
                                spellcheck="false"
                            >
                            <div class="search-hint" id="searchHint"></div>
                        </div>
                    </div>

                </div>
        <main class="right-panel">
            <div class="results-header">
                <h2>Αποτελέσματα</h2>
                <span class="results-count" id="resultsCount">0 εγγραφές</span>
            </div>
            <div class="results-scroll" id="resultsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Φόρτωση εγγραφών…
                </div>
            </div>
            <div class="pagination" id="pagination" style="display:none">
                <button id="btnFirst"  onclick="goToPage(1)"            >«</button>
                <button id="btnPrev"   onclick="goToPage(currentPage-1)">‹</button>
                <span class="page-info" id="pageInfo"></span>
                <button id="btnNext"   onclick="goToPage(currentPage+1)">›</button>
                <button id="btnLast"   onclick="goToPage(totalPages)"   >»</button>
            </div>
        </main>
        </div><!-- /.right-wrapper -->

    </div>

    <script type="module" src="/js/index/app.js"></script>
</body>
</html>
