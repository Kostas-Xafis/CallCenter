<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <script>
      (function(){var t=localStorage.getItem('callcenter-theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}if(t==='dark'){document.documentElement.classList.add('dark-mode');}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>251 ΓΝΑ CallCenter — Σύνδεση</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#41509b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CallCenter">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
    <link rel="stylesheet" href="/css/shared/reset.css">
    <link rel="stylesheet" href="/css/shared/theme.css">
    <link rel="stylesheet" href="/css/login/main.css">
</head>
<body>
    <div class="card">
        <div class="logo">
            <span class="logo-title">251 ΓΝΑ</span>
            <span class="logo-sub">CallCenter</span>
        </div>

        <form id="loginForm">
            <div class="field">
                <label for="username">Όνομα χρήστη</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       placeholder="username" required>
            </div>
            <div class="field">
                <label for="password">Κωδικός</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Σύνδεση</button>
            <div class="error" id="errorMsg"></div>
        </form>
    </div>

    <script type="module" src="/js/login/login.js"></script>
</body>
</html>
